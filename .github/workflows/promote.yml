# Hands a release on to installed copies: makes it the latest release of this
# repository. The app reads …/releases/latest/download/latest.json (electron/updater.js);
# release.yml publishes every tag as a pre-release, which is never the latest. Run by
# hand once you've tried a release for a while: Actions → Promote → Run workflow.
# Promoting an older release makes it the download for new installs, but installed
# copies only ever move to a newer version.
name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote, e.g. 0.1.5. Empty: the newest release."
        required: false

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            tag="v${VERSION#v}"
          else
            tag="$(gh release list --limit 1 --json tagName -q '.[0].tagName')"
          fi
          [ -n "$tag" ] || { echo "::error::There's no release yet. Push a vX.Y.Z tag first."; exit 1; }
          assets="$(gh release view "$tag" --json assets -q '.assets[].name')"
          grep -qx latest.json <<< "$assets" \
            || { echo "::error::$tag has no latest.json; it was built before releases carried one, or its Release run hasn't finished."; exit 1; }
          grep -qx Rappespalter-Setup.exe <<< "$assets" \
            || { echo "::error::$tag has no Rappespalter-Setup.exe. Wait for its Release run to finish, or run it again."; exit 1; }

          gh release edit "$tag" --prerelease=false --latest

          # What installed copies will see. GitHub may take a moment to follow, so a
          # mismatch here is only a warning.
          feed="https://github.com/$GH_REPO/releases/latest/download/latest.json"
          echo "Feed: $feed"
          offered="$(curl -fsSL "$feed" | jq -r .version || true)"
          [ "v$offered" = "$tag" ] && echo "Feed now offers $offered" \
            || echo "::warning::The feed still offers '${offered:-nothing}'; check again in a minute. (Is the repository public?)"
