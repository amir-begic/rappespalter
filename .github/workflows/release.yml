# Every pushed vX.Y.Z tag: build the installers for Windows, macOS and Linux and publish
# them as a pre-release, with latest.json, the feed entry installed copies read
# (electron/updater.js). They don't see it yet: they read the repository's *latest*
# release, and a pre-release never is. promote.yml makes one the latest once you've tried
# it, so the newest promoted installers are always at …/releases/latest/download/<file>.
# Installed copies update from the Windows installer, the macOS zip (the .app, which
# the app swaps in itself; the dmg is for first installs) and the Linux AppImage.
#
# Each system builds on its own runner, where `pnpm install` pulls that system's native
# libsql binary (@libsql/win32-x64-msvc, darwin-arm64, linux-x64-gnu). Cross-building doesn't work
# because the SQLite layer is native. The Mac build is Apple silicon only (the runner's
# architecture); an Intel build would need its own Intel runner.
#
# Run by hand (Actions → Release → Run workflow) for a test build: the installers are
# kept as workflow artifacts for 3 days and nothing is published.
name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*" # git tag v0.1.5 && git push origin v0.1.5

permissions:
  contents: write # needed to create the Release

# Run JavaScript actions on Node 24. Several pinned actions (incl.
# pnpm/action-setup@v4, which has no Node 24 release yet) still declare Node 20,
# which GitHub is deprecating. This opts all of them into Node 24 now; it becomes
# the default on 2026-06-16, after which this line is a harmless no-op.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false # one system failing shouldn't cancel the others' builds
      matrix:
        include:
          - name: windows
            runner: windows-latest
            target: --win
            files: dist/Rappespalter-Setup.exe
          - name: mac-arm64
            # Pinned rather than macos-latest: the latest arm64 pool had no free runners
            # in Nov 2026 (jobs cancelled after 15 min queued). Still Apple silicon.
            runner: macos-15
            # Fail rather than ship an unsigned app if no signing identity is found.
            target: --mac -c.mac.forceCodeSigning=true
            files: |
              dist/Rappespalter-mac-arm64.dmg
              dist/Rappespalter-mac-arm64.zip
          - name: linux
            runner: ubuntu-latest
            target: --linux
            files: dist/Rappespalter-linux-x64.AppImage
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45 # notarization can take a while; a hung run would otherwise burn up to 6 hours
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the version matches the tag
        # Installed copies compare package.json's version (app.getVersion()) with the
        # feed's, so a tag that doesn't match would be offered again and again.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json says $version but the tag is $GITHUB_REF_NAME. Bump the version, commit, and tag that commit."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mac signing and notarization credentials
        # The Mac app is signed with the Developer ID certificate and notarized by Apple
        # (mac.notarize in package.json), so a downloaded copy opens without warnings.
        # Only the Mac build gets these: on Windows, CSC_LINK would be taken as a
        # Windows code-signing certificate. Without them the build stops rather than
        # publishing an app macOS calls "damaged".
        if: matrix.name == 'mac-arm64'
        env:
          CERT: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in CERT CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is missing (see docs/ELECTRON.md, Mac signing)."; exit 1; fi
          done
          {
            echo "CSC_LINK=$CERT"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build installer
        # `pnpm dist` runs: next build -> assemble-standalone -> electron-builder.
        # No dev.db exists in CI, so the app ships with an empty database (each
        # user imports their own data) — assemble-standalone.mjs handles this.
        # DATABASE_URL is set only to satisfy module load during `next build`.
        # The Mac build needs identity discovery on: it then searches only the temporary
        # keychain made from CSC_LINK (step above). With it off and no identity name,
        # electron-builder doesn't look at all and skips signing. Elsewhere it's off.
        run: pnpm dist ${{ matrix.target }} --publish never
        env:
          DATABASE_URL: "file:./dev.db"
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.name == 'mac-arm64' && 'true' || 'false' }}
          # Log each codesign call and the notarization progress (electron-builder itself
          # is silent between "signing" and "notarization successful").
          DEBUG: ${{ matrix.name == 'mac-arm64' && 'electron-osx-sign*,electron-notarize*' || '' }}

      - name: Test the packaged app
        # Starts the app just built on a throwaway data folder (e2e/app.spec.ts): the
        # bundled server, the API token, migrations, backups. A broken build stops
        # here, before anything is uploaded or published.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pnpm test:e2e; else pnpm test:e2e; fi

      - name: Upload installer artifact
        # Manual runs keep it for 3 days to try; tag builds hand it to the publish job,
        # and the Release keeps it from there.
        uses: actions/upload-artifact@v4
        with:
          name: rappespalter-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 3 || 1 }}
          compression-level: 0 # installers are already compressed; skip wasted CPU

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes list the commits since the previous tag

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"

          # The notes: this version's section of CHANGELOG.md ("## 1.6.0 — date"),
          # else the commits since the previous tag.
          awk -v v="${tag#v}" '/^## /{p = ($2 == v); next} p' CHANGELOG.md \
            | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md || true
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::CHANGELOG.md has no section for ${tag#v}; using the commit list"
            previous="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..$tag" > notes.md
            else
              git log -1 --format='- %s' "$tag" > notes.md
            fi
          fi

          # The feed entry: what the release is, and per system where its update package
          # is, its size and SHA-256 (toRelease in electron/updater.js).
          node -e '
            const fs = require("node:fs"), crypto = require("node:crypto")
            const [tag, repo] = process.argv.slice(1)
            const packages = {
              "win-x64": "Rappespalter-Setup.exe",
              "mac-arm64": "Rappespalter-mac-arm64.zip",
              "linux-x64": "Rappespalter-linux-x64.AppImage",
            }
            for (const [system, file] of Object.entries(packages)) {
              const bytes = fs.readFileSync(`dist/${file}`)
              packages[system] = {
                file,
                size: bytes.length,
                sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
                download: `https://github.com/${repo}/releases/download/${tag}/${file}`,
              }
            }
            const feed = {
              version: tag.replace(/^v/, ""),
              published: new Date().toISOString(),
              // Settings → Updates shows plain text: no bold markers or link syntax.
              notes: fs.readFileSync("notes.md", "utf8").replace(/\*\*/g, "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1"),
              page: `https://github.com/${repo}/releases/tag/${tag}`,
              packages,
            }
            fs.writeFileSync("latest.json", JSON.stringify(feed, null, 2) + "\n")
          ' "$tag" "$GITHUB_REPOSITORY"
          cat latest.json

          # A re-run for the same tag replaces the files and leaves the Release as it is
          # (promoted or not).
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* latest.json --clobber
          else
            gh release create "$tag" dist/* latest.json --prerelease --latest=false \
              --title "Rappespalter ${tag#v}" --notes-file notes.md --verify-tag
          fi
