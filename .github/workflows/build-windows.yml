name: Build Windows app

# Builds the Electron desktop client on a real Windows runner, where
# `pnpm install` pulls the Windows-native libsql binary (@libsql/win32-x64-msvc).
# Cross-building this from Linux does not work because the SQLite layer is native.

on:
  workflow_dispatch: {} # manual "Run workflow" button
  push:
    tags:
      - "v*" # pushing a tag (git push origin v0.1.2) builds + creates the Release
  release:
    types: [published] # creating/publishing a Release in the GitHub UI builds + attaches the installer

permissions:
  contents: write # needed to create/update a Release

# Run JavaScript actions on Node 24. Several pinned actions (incl.
# pnpm/action-setup@v4, which has no Node 24 release yet) still declare Node 20,
# which GitHub is deprecating. This opts all of them into Node 24 now; it becomes
# the default on 2026-06-16, after which this line is a harmless no-op.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        # `pnpm dist` runs: next build -> assemble-standalone -> electron-builder.
        # No dev.db exists in CI, so the app ships with an empty database (each
        # user imports their own data) — assemble-standalone.mjs handles this.
        # DATABASE_URL is set only to satisfy module load during `next build`.
        run: pnpm dist --publish never
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Upload installer artifact
        # Only for manual runs; tag/release builds already attach the
        # installer to the Release, which doesn't count against Actions storage.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rappespalter-windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 3
          compression-level: 0 # .exe is already compressed; skip wasted CPU

      - name: Attach installer to Release
        # Runs for tag pushes and Release events (not plain workflow_dispatch).
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.release.tag_name || github.ref_name }}"
          $exe = (Get-ChildItem dist/*.exe | Select-Object -First 1).FullName
          # Create the Release if it doesn't exist yet (tag-push path); on the
          # release-event path it already exists, so just attach the installer.
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag "$exe" --clobber
