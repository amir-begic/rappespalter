<!doctype html>
<!-- Shown by electron/main.js while the standalone server starts, so a click on
     the app icon gets a window straight away. Colours match globals.css. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Rappespalter</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f9fafb;
        --fg: #6b7280;
        --track: #e5e7eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121419;
          --fg: #9ca3af;
          --track: #262a33;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      svg {
        width: 72px;
        height: 72px;
      }
      .bar {
        width: 160px;
        height: 3px;
        border-radius: 3px;
        background: var(--track);
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #0f766e;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#0f766e" />
      <circle cx="16" cy="16" r="9" fill="none" stroke="#ecfdf5" stroke-width="2.5" />
      <path d="M16 7v18" stroke="#ecfdf5" stroke-width="2.5" stroke-linecap="round" />
    </svg>
    <div class="bar"></div>
    <div>Starting Rappespalter…</div>
  </body>
</html>
