<!doctype html>
<!-- Shown by electron/main.js while the standalone server starts, so a click on
     the app icon gets a window straight away. Colours match globals.css (light).

     The name is written out in one ink line, stroke by stroke. Letterforms: Hershey
     "Script 1-stroke" (public-domain glyph data, via the hersheytext package),
     smoothed into curves; each path's --d/--t is its start and duration so the pen
     moves at a steady speed. main.js (LOADING_ANIMATION_MS) waits for the last stroke
     before it shows the app: change both together. -->

  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Rappespalter</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ea;
        --ink: #2f4fe0;
        --muted: #74727b;
        --yellow: #fbc93d;
        --pink: #f0b6c8;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .word {
        width: min(520px, 70vw);
        overflow: visible;
      }
      .word path {
        fill: none;
        stroke: var(--ink);
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1 2;
        stroke-dashoffset: 1;
        opacity: 0;
        animation: write var(--t) cubic-bezier(0.45, 0.05, 0.55, 0.95) var(--d) forwards;
      }
      @keyframes write {
        0% { opacity: 1; stroke-dashoffset: 1; }
        100% { opacity: 1; stroke-dashoffset: 0; }
      }
      .caption {
        font: 500 11px system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0;
        animation: fade 600ms ease 1.2s forwards;
      }
      @keyframes fade {
        to { opacity: 1; }
      }
      /* Flat ink blots at the edges, as in the app (components/blobs.tsx). */
      .blob {
        position: fixed;
        pointer-events: none;
      }
      .blob.a { top: -140px; right: -120px; width: 360px; fill: var(--yellow); }
      .blob.b { bottom: -170px; left: -150px; width: 400px; fill: var(--pink); }
      /* main.js adds this once the name is written and the app is ready. */
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        transition: opacity 250ms ease;
      }
      body.leaving .stage {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .word path { animation: none; opacity: 1; stroke-dashoffset: 0; }
        .caption { animation: none; opacity: 1; }
      }
    </style>
  </head>
